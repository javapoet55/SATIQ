</style><body><div class="shell"><aside><div class="brand">✳ <span>way</span>point</div><div class="eyebrow">SAT STUDIO</div><nav aria-label="Feature navigation"><button data-screen="plan">◫ &nbsp; Daily Plan</button><button data-screen="tutor">✧ &nbsp; Guided Tutor</button><button data-screen="analysis">↻ &nbsp; Mistake Analysis</button></nav><div class="profile">SMALL STEPS. REAL PROGRESS.<br><br><a href="waypoint.html">← Original SAT Studio</a><br><br>Alex Lee · Student<br>Learning Companion · UI concept</div></aside><main><header><span class="eyebrow" id="crumb">YOUR STUDY SPACE</span><div class="header-actions"><a class="backlink" href="waypoint.html">SAT Studio ↗</a><span class="avatar">AL</span></div></header><div id="view" tabindex="-1"></div><footer>Original Waypoint design · Fictional student data · Scripted AI interactions.<br><a href="ai-design-specifications.html">Developer specifications ↗</a> · <a href="waypoint.html">Original prototype ↗</a></footer></main></div><div id="toast" class="toast hidden" role="status"></div><script>
const $=s=>document.querySelector(s);
let screen='plan',subject='math',picked=null,checked=false,hintLevel=0,chatEntries=[],reflect='',analysis=false,confirmed=false,cause='calculation',minutes=20,day=6,completed=new Set(),activeTask=null;
const questions={
math:{skill:'Linear equations',text:'A community garden rents a tool kit for a one-time fee of $18 plus $7 per day. The total cost was $60. For how many days was the kit rented?',choices:['4 days','6 days','8 days','11 days'],correct:1},
rw:{skill:'Transitions',text:'For years, the town’s old station stood empty. Residents restored it last spring; ______, it now hosts a busy weekend market. Which choice completes the text with the most logical transition?',choices:['nevertheless','for instance','as a result','in contrast'],correct:2}
};
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function go(s){screen=s;location.hash=s;render();$('#view').focus()}
function intro(label,title,desc){return '<div class="feature-intro intro"><div><div class="eyebrow">'+label+'</div><h1>'+title+'</h1><p class="muted">'+desc+'</p></div><span class="notice">✦ Interactive UI concept</span></div>'}
function switchSubject(s){subject=s;picked=null;checked=false;hintLevel=0;chatEntries=[];render()}
function question(){let q=questions[subject];return '<div class="row"><span class="pill">'+q.skill+' · Medium</span><span class="muted" style="font-size:12px">Original practice question</span></div><p class="questiontext">'+q.text+'</p><div class="answers" role="group" aria-label="Answer choices">'+q.choices.map((a,i)=>'<button class="answer '+(picked===i?'selected':'')+' '+(checked&&i===q.correct?'correct':'')+'" aria-pressed="'+(picked===i)+'" onclick="picked='+i+';checked=false;render()"><b>'+'ABCD'[i]+'</b><span>'+a+(checked&&i===q.correct?' · ✓ Correct answer':'')+'</span></button>').join('')+'</div>'}
function tutor(){let q=questions[subject];return intro('QUESTION PRACTICE / GUIDED AI TUTOR','A nudge in the right direction.','Get just enough help to take the next step yourself.')+'<div class="tabs"><button class="'+(subject==='math'?'active':'')+'" onclick="switchSubject(\'math\')">Math</button><button class="'+(subject==='rw'?'active':'')+'" onclick="switchSubject(\'rw\')">Reading & Writing</button></div><div class="workspace"><section><div class="card question">'+question()+(checked?'<div class="feedback" role="status"><strong>'+(picked===q.correct?'That’s right.':'Let’s learn from this one.')+'</strong><p>'+(subject==='math'?'18 + 7d = 60. Subtract 18, then divide 42 by 7: 6 days.':'The market opening is a result of the restoration. “As a result” expresses that connection.')+'</p></div>':'')+'<div class="row questionfooter"><span class="caption">Hints help you learn.<br>Your first answer is recorded separately.</span><button class="primary" '+(picked===null?'disabled':'')+' onclick="check()">Check answer →</button></div></div><div class="softcard spaced"><div class="row"><strong>Make the thinking yours.</strong><span class="pill">'+hintLevel+' of 3 hints opened</span></div><p class="caption">Try a step after each hint. The full solution appears only when you check your answer.</p></div>'+(activeTask?'<button class="wide spaced" '+(!checked?'disabled':'')+' onclick="completeTask()">Complete demo activity & return to plan →</button>':'')+'</section><section class="card tutor-panel" aria-label="Guided tutor"><div class="tutor-head"><div class="row"><div class="tutor-title"><span class="tutor-mark">✧</span><div><h3>Waypoint Tutor</h3><p class="caption" style="margin:0">Here to help you think it through</p></div></div><span class="pill">Practice only</span></div></div><div class="chat" role="log" aria-label="Tutor conversation"><div class="bubble"><small>WAYPOINT TUTOR</small><p>Let’s work on this together. Ask for a small hint, or tell me which step feels unclear.</p></div>'+chatEntries.map(e=>'<div class="bubble '+(e.role==='user'?'user':'')+'"><small>'+(e.role==='user'?'YOU':'WAYPOINT TUTOR')+'</small><p>'+escapeHTML(e.text)+'</p></div>').join('')+'</div><div class="tutor-bottom"><span class="sectionlabel">TRY A STARTING POINT</span><div class="chips"><button '+(hintLevel>=3?'disabled':'')+' onclick="hint()">✧ '+(hintLevel?'Next small hint':'Give me a small hint')+'</button><button onclick="explain()">Explain this step</button><button '+(picked===null?'disabled':'')+' onclick="why()">Discuss my choice</button></div><form class="spaced" onsubmit="ask(event)"><label class="hidden" for="ask">Your question to the tutor</label><input id="ask" placeholder="Tell me where you’re stuck…" maxlength="500"><button class="primary" aria-label="Send question">↑</button></form><p class="caption">Scripted demo replies · No live AI connection.<br>AI help is unavailable during timed tests.</p></div></section></div>'}
function add(u,a){chatEntries.push({role:'user',text:u},{role:'tutor',text:a});render()}
function hint(){let h=subject==='math'?['The total includes two parts: a one-time fee and a cost for each day. Which part changes with the number of days?','Remove the one-time $18 fee from the $60 total. How much is left for the daily charges?','There is $42 left for daily charges. Each day costs $7. What operation gives the number of days?']:['Compare the two ideas: the station was restored, then it became a market. Is that a contrast or a consequence?','The restoration made the market possible. Look for a transition that signals a result.','Eliminate the contrast words first. Then compare an example transition with a result transition.'];if(hintLevel<3)add('Give me '+(hintLevel?'another':'a small')+' hint.',h[hintLevel++])}
function explain(){add('Explain the next step.',subject==='math'?'Start by subtracting the fixed fee from the total: 60 − 18 = 42. This leaves the part paid per day. Can you turn that into an equation?':'A semicolon joins the ideas. The transition after it should explain how the market opening relates to the restoration. What relationship do you see?')}
function why(){if(picked===null)return;add('Can we discuss choice '+'ABCD'[picked]+'?',checked?(subject==='math'?'Substitute your choice into 18 + 7d. Does it equal 60? The value d = 6 does.':'The intended link is cause and effect. “As a result” matches it.'):(subject==='math'?'Try substituting '+questions.math.choices[picked]+' into the daily cost, then add the fixed fee. Does it match $60?':'Read the sentence with your chosen transition. Does it express the restoration causing the market to open?'))}
function ask(e){e.preventDefault();let v=$('#ask').value.trim();if(!v)return;add(v,'This is a scripted UI preview, so I can’t interpret a custom question yet. Use the hint buttons to explore the guided flow. A connected tutor would respond using this question’s verified solution.')}
function check(){checked=true;render()}
function analysisView(){return intro('ANSWER REVIEW / MISTAKE ANALYSIS','Find the lesson in the miss.','Your reasoning matters more than a single answer.')+'<div class="stepper"><span class="on"><b>1</b> Reflect</span><span>→</span><span class="'+(analysis?'on':'')+'"><b>2</b> Understand</span><span>→</span><span class="'+(confirmed?'on':'')+'"><b>3</b> Try again</span></div><div class="workspace"><section><div class="card question"><div class="row"><span class="pill">Linear equations · Previous attempt</span><span class="priority">↻ Review</span></div><p class="questiontext">'+questions.math.text+'</p><div class="result-strip"><div><strong>Your answer: A · 4 days</strong><br><span>Correct answer: B · 6 days</span></div></div><div class="spaced"><h3>Walk me through your thinking.</h3><p class="caption">What steps did you take? What felt uncertain?</p><textarea id="reflection" aria-label="Describe how you solved the question" oninput="reflect=this.value" placeholder="For example: I subtracted the fee, then divided…">'+escapeHTML(reflect)+'</textarea><div class="row"><button onclick="reflect=\'I knew I needed to remove the fee. I wrote 60 − 18 = 28, then divided by 7 and got 4.\';analysis=false;confirmed=false;render()">Use example reflection</button><button class="primary" onclick="analyze()" '+(!reflect.trim()?'disabled':'')+'>Explore my mistake →</button></div></div></div><div class="softcard spaced"><strong>A mistake is a clue, not a label.</strong><p class="caption">You can change the suggested cause. Your own explanation is the starting point.</p></div></section><section>'+(!analysis?'<div class="card" style="padding:32px"><span class="tutor-mark">↗</span><h2 style="margin:22px 0 12px">Let’s look at your approach.</h2><p class="muted">Add a reflection to see a sample analysis, a suggested cause, and a practical next step.</p><div class="insight"><strong>Look for the first step that changed.</strong><p class="caption">Did the equation, the calculation, or the question itself cause the difficulty?</p></div><span class="notice">Scripted analysis preview</span></div>':'<div class="card"><div class="row"><span class="eyebrow">SUGGESTED INSIGHT</span><span class="pill">Please confirm</span></div><h2 style="margin:14px 0">The setup may be right.<br>Check the arithmetic.</h2><div class="insight"><p>In the sample reflection, the subtraction is the first step that goes off track.</p><div class="equation">60 − 18 = 42, not 28</div></div><p class="caption">This demo always illustrates a calculation slip. It does not evaluate custom text.</p><h3 class="spaced">Does this describe what happened?</h3><fieldset style="padding:0;border:0;margin:0"><legend class="caption">Choose the cause that fits best</legend><div class="cause-list">'+[['calculation','Calculation slip','I had the approach, but made an arithmetic error.'],['concept','Concept gap','I wasn’t sure how to set up the equation.'],['reading','Question misunderstanding','I misread what the question was asking.'],['unsure','Something else / not sure','I’d like to explore another explanation.']].map(c=>'<label class="cause"><input type="radio" name="cause" value="'+c[0]+'" '+(cause===c[0]?'checked':'')+' onchange="cause=this.value;confirmed=false;render()"><span><strong>'+c[1]+'</strong><small>'+c[2]+'</small></span></label>').join('')+'</div></fieldset><button class="primary wide" onclick="confirmed=true;render()">Confirm my reflection</button></div>'+(confirmed?'<div class="card spaced" style="background:var(--mint)" role="status"><span class="eyebrow">YOUR NEXT STEP</span><h2 style="margin:10px 0">'+({calculation:'Build in a quick check.',concept:'Separate the two costs.',reading:'Name what you need to find.',unsure:'Talk through the first step.'}[cause])+'</h2><p>'+({calculation:'Estimate the subtraction, then substitute your final answer into the original equation.',concept:'Write the fixed fee and the daily charge as separate parts before solving.',reading:'Underline “how many days” and define d before you calculate.',unsure:'Open the guided tutor and ask for a small hint to identify where you feel stuck.'}[cause])+'</p><button class="primary spaced" onclick="subject=\'math\';picked=null;checked=false;go(\'tutor\')">Try again with the tutor →</button>'+(activeTask==2?'<button class="wide spaced" onclick="completeTask()">Complete review & return to plan</button>':'')+'</div>':'') )+'</section></div>'}
function analyze(){reflect=$('#reflection').value;if(!reflect.trim())return;analysis=true;confirmed=false;render()}
function taskSet(){return [{id:0,title:'Find your algebra rhythm',skill:'Linear equations',count:minutes===10?3:5,time:minutes===10?5:10,type:'math',reason:'A focused set for the skill you’re still building.',icon:'ƒ',label:'Priority skill'},{id:1,title:'Connect the ideas',skill:'Transitions',count:minutes===10?2:3,time:minutes===10?3:5,type:'rw',reason:'Mix in reading practice after working with numbers.',icon:'Aa',label:'Keep it fresh'},{id:2,title:'Turn a miss into a win',skill:'Mistake review',count:2,time:minutes===10?2:5,type:'review',reason:'Revisit two questions from last week.',icon:'↻',label:'Ready to review'}].concat(minutes===30?[{id:3,title:'A little extra stretch',skill:'Linear equations',count:5,time:10,type:'math',reason:'An optional extra set for your longer session.',icon:'↗',label:'Stretch practice'}]:[])}
function plan(){let tasks=taskSet(),done=tasks.filter(t=>completed.has(t.id)).length;return intro('DASHBOARD / PERSONALIZED DAILY PLAN','A plan that meets you here.','A little focus today. A stronger foundation tomorrow.')+'<div class="card hero planhero"><div><span class="eyebrow">SATURDAY, NOVEMBER 7 · YOUR DAILY PLAN</span><h2 class="hero-title">'+(done===tasks.length?'You made time for progress.':'Let’s make '+minutes+' minutes count.')+'</h2><p class="muted">'+(done===tasks.length?'Your demo plan is complete. Come back for another small step.':'A balanced mix of a priority skill, fresh practice, and a second chance.')+'</p><div class="eyeline" style="color:#cddfd2"><span>✦ Based on sample learning history</span><span>·</span><span>'+tasks.reduce((n,t)=>n+t.count,0)+' questions</span></div></div><div class="softcard" style="color:var(--ink)"><span class="sectionlabel">TODAY’S PROGRESS</span><div style="font:36px Georgia;margin:12px 0">'+done+' <span style="font:15px system-ui">of '+tasks.length+' activities</span></div><div class="bar"><i style="width:'+done/tasks.length*100+'%"></i></div><small>One focused step at a time.</small></div></div><div class="schedule" aria-label="Week overview">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>'<button class="'+(i===day?'active':'')+'" aria-pressed="'+(i===day)+'" onclick="day='+i+';render()"><small>'+d+'</small><b>'+(i+2)+'</b><small>'+(i<5?'✓ Done':i===5?'Today':'Upcoming')+'</small></button>').join('')+'</div>'+(day!==5&&day!==6?'<div class="feedback" role="status">Sample history: this day’s practice is complete. Select Saturday to return to your active plan.</div>':day===6?'<div class="feedback" role="status">Sunday preview: a lighter review day. Your next plan will be ready tomorrow.</div>':'')+'<div class="plan-grid spaced"><section><div class="row"><h2>'+ (day===6?'Tomorrow’s suggested focus':day<5?'Your completed routine':'Your next small steps')+'</h2><span class="muted" style="font-size:12px">'+minutes+' min total</span></div><div class="plan-list">'+tasks.map((t,i)=>'<article class="plan-task '+(completed.has(t.id)||day<5?'done':'')+'"><span class="task-icon">'+(completed.has(t.id)||day<5?'✓':t.icon)+'</span><div><div class="row"><h3>'+t.title+'</h3><span class="priority">'+t.label+'</span></div><div class="task-detail"><span>'+t.count+' questions</span><span>◷ '+t.time+' min</span><span>'+t.skill+'</span></div><p class="reason">'+t.reason+'</p></div><button '+(day!==5||completed.has(t.id)?'disabled':'')+' class="'+(!i?'primary':'')+'" onclick="startTask('+t.id+')">'+(completed.has(t.id)||day<5?'✓ Done':day===6?'Upcoming':'Start →')+'</button></article>').join('')+'</div><p class="caption">Activity counts describe the planned product. Each activity opens one representative question in this UI demo.</p></section><section><div class="card"><span class="eyebrow">MAKE ROOM FOR STUDY</span><h2 style="margin:12px 0">How much time today?</h2><p class="muted">Adjust the plan to fit your day.</p><div class="time-options">'+[10,20,30].map(n=>'<button class="'+(minutes===n?'active':'')+'" aria-pressed="'+(minutes===n)+'" onclick="minutes='+n+';render()">'+n+' min</button>').join('')+'</div></div><div class="card spaced"><div class="row"><h3>Why this plan?</h3><span class="tutor-mark" style="width:30px;height:30px;font-size:18px">✧</span></div><div class="insight"><strong>Algebra gets the first slot.</strong><p class="caption">Sample history: 3 of your last 5 linear-equation answers needed another look.</p></div><p class="muted" style="font-size:13px">Transitions keep practice varied. Older mistakes return for a fresh attempt.</p><div class="mini-stats spaced"><div><strong>60%</strong><span class="caption">Algebra accuracy · mock</span></div><div><strong>7 days</strong><span class="caption">Practice streak · mock</span></div></div></div><div class="softcard spaced"><h3>Consistency over intensity.</h3><p class="caption">A shorter session still moves you forward. Choose a plan you can finish.</p></div></section></div>'}
function startTask(id){activeTask=id;let t=taskSet().find(t=>t.id===id);if(t.type==='review'){analysis=false;confirmed=false;go('analysis')}else{subject=t.type;picked=null;checked=false;hintLevel=0;chatEntries=[];go('tutor')}}
function completeTask(){if(activeTask!==null)completed.add(activeTask);activeTask=null;go('plan');toast('Demo activity complete. Your plan has been updated.')}
function render(){document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.screen===screen);b.setAttribute('aria-current',b.dataset.screen===screen?'page':'false')});$('#view').innerHTML=({plan,tutor,analysis:analysisView})[screen]();$('#crumb').textContent=screen==='plan'?'YOUR STUDY SPACE':screen==='tutor'?'PRACTICE / GUIDED TUTOR':'REVIEW / MISTAKE ANALYSIS';if($('#reflection'))$('#reflection').addEventListener('input',()=>{let b=$('#reflection').parentElement.querySelector('.primary');b.disabled=!$('#reflection').value.trim()})}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.screen));window.addEventListener('hashchange',()=>{let s=location.hash.slice(1);if(['plan','tutor','analysis'].includes(s)){screen=s;render()}});if(['plan','tutor','analysis'].includes(location.hash.slice(1)))screen=location.hash.slice(1);day=5;render();
</script></body></html>
